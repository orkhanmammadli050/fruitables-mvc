<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{admin/layout}" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">Title</title>
</head>
<body>


<main layout:fragment="content">

    <a href="/dashboard/category/create">Kateqoriya əlavə et</a>

    <table class="table">
        <thead class="thead-dark">
        <tr>
            <th scope="col">#</th>
            <th scope="col">Ad</th>
            <th scope="col">Əməliyyatlar</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="category, i : ${categories}">
            <th  th:text="${i.count}" scope="row">1</th>
            <td th:text="${category.name}">Mark</td>
            <td>
                <a th:href="'/dashboard/category/update/' + ${category.id}">Redaktə et</a>
                <a th:href="@{'/dashboard/category/delete/' + ${category.id}}" class="btn btn-danger btn-sm">Sil</a>
            </td>

        </tr>

        </tbody>
    </table>
</main>

</body>
</html>
