<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{admin/layout}" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Sifarişlər</title>
</head>
<body>

<main layout:fragment="content" class="container-fluid">

    <h1 class="h3 mb-4 text-gray-800">Sifarişlər Siyahısı</h1>

    <div class="card shadow mb-4">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered" width="100%" cellspacing="0">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>İstifadəçi e-poçtu</th>
                        <th>Ünvan</th>
                        <th>Telefon</th>
                        <th>Tarix</th>
                        <th>Status</th>
                        <th>Əməliyyatlar</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="order, iterStat : ${orders}">
                        <td th:text="${iterStat.count}">1</td>
                        <td th:text="${order.user != null ? order.user.email : 'N/A'}">Email</td>
                        <td th:text="${order.address}">Address</td>
                        <td th:text="${order.phone}">Phone</td>
                        <td th:text="${order.orderDate}">Date</td>
                        <td th:text="${order.orderStatus}">Status</td>
                        <td>
                            <a th:href="@{'/dashboard/order/delete/' + ${order.id}}" class="btn btn-danger btn-sm">Sil</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</main>

</body>
</html>
