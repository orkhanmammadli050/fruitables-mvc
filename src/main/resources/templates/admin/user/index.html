<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{admin/layout}" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>İstifadəçilər</title>
</head>
<body>

<main layout:fragment="content" class="container-fluid">

    <h1 class="h3 mb-4 text-gray-800">İstifadəçilər Siyahısı</h1>

    <div class="card shadow mb-4">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered" width="100%" cellspacing="0">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Ad</th>
                        <th>Soyad</th>
                        <th>Email</th>
                        <th>Əməliyyatlar</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user, iterStat : ${users}">
                        <td th:text="${iterStat.count}">1</td>
                        <td th:text="${user.firstname}">Firstname</td>
                        <td th:text="${user.lastname}">Lastname</td>
                        <td th:text="${user.email}">Email</td>
                        <td>
                            <a th:href="@{'/dashboard/user/delete/' + ${user.id}}" class="btn btn-danger btn-sm">Sil</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</main>

</body>
</html>
