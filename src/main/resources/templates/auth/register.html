<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout}" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">Your Ultimate Game Marketplace</title>

</head>
<body layout:fragment ="content">

<!-- Register Form -->
<section class="section" style="margin-top: 150px; margin-bottom: 50px;">
    <div class="container" style="max-width: 500px;">
        <div class="card">
            <h2 style="text-align: center; margin-bottom: 2rem;">Hesab yarat</h2>

            <form th:object="${registerDto}" method="post">

                <div th:if="${emailError}" class="alert alert-danger" th:text="${emailError}"></div>

                <div class="form-group">
                    <label class="form-label" for="firstname">Ad</label>
                    <input  th:field="*{firstname}"  type ="text" id="firstname" class="form-input" placeholder="Adınızı daxil edin"
                            oninvalid="this.setCustomValidity('Zəhmət olmasa bu xananı doldurun')"
                            oninput="this.setCustomValidity('')" required>
                    <div style="color: red" th:if="${#fields.hasErrors('firstname')}" th:errors="*{firstname}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="lastname">Soyad</label>
                    <input th:field="*{lastname}" type="text" id="lastname" class="form-input" placeholder="Soyadınızı daxil edin"
                           oninvalid="this.setCustomValidity('Zəhmət olmasa bu xananı doldurun')"
                           oninput="this.setCustomValidity('')" required>
                    <div style="color: red" th:if="${#fields.hasErrors('lastname')}" th:errors="*{lastname}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input th:field="*{email}" type="email" id="email" class="form-input" placeholder="Emailinizi daxil edin"
                           required
                           oninvalid="if(this.value === ''){this.setCustomValidity('Zəhmət olmasa bu xananı doldurun')} else{this.setCustomValidity('Zəhmət olmasa e-poçt ünvanına @ işarəsi daxil edin')}"
                           oninput="this.setCustomValidity('')">
                    <div style="color: red" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Şifrə</label>
                    <input th:field="*{password}" type="password" id="password" class="form-input" placeholder="Şifrənizi daxil edin"
                           oninvalid="this.setCustomValidity('Zəhmət olmasa bu xananı doldurun')"
                           oninput="this.setCustomValidity('')" required>
                    <div style="color: red" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm-password">Şifrəni təsdiqlə</label>
                    <input name="confirmPassword" type="password" id="confirm-password" class="form-input" placeholder="Şifrənizi təsdiqləyin"
                           oninvalid="this.setCustomValidity('Zəhmət olmasa bu xananı doldurun')"
                           oninput="this.setCustomValidity('')" required>
                </div>

                <!-- Publisher-only fields -->
                <div id="publisher-fields" style="display: none;">
                    <div class="form-group">
                        <label class="form-label" for="company-name">Company Name</label>
                        <input type="text" id="company-name" class="form-input" placeholder="Enter your company name">
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" class="checkbox-input"
                               oninvalid="this.setCustomValidity('Zəhmət olmasa bu xananı işarələyin')"
                               oninput="this.setCustomValidity('')" required>
                        <label for="terms" class="form-label" style="margin: 0;">
                            <a href="#">İstifadə şərtləri</a> və <a href="#">Məxfilik siyasəti</a> ilə razıyam                        </label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                    Hesab yarat
                </button>
            </form>

            <div style="text-align: center; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border-color);">
                <p class="text-muted">Artıq hesabınız var?</p>
                <a href="/login" class="btn btn-outline" style="width: 100%; margin-top: 1rem;">
                    Daxil ol
                </a>
            </div>
        </div>
    </div>
</section>

</body>
</html>
