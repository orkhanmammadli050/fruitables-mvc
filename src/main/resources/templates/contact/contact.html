<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout}" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">Title</title>
</head>
<body>


<main layout:fragment="content">

    <div class="container-fluid bg-light py-3 mb-2">
        <div class="container">
            <nav>
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item">
                        <a th:href="@{/}" class="text-decoration-none text-muted">
                            <i class="fa fa-home me-1"></i>Əsas səhifə
                        </a>
                    </li>
                    <li class="breadcrumb-item active text-primary fw-bold" aria-current="page">Əlaqə</li>
                </ol>
            </nav>
        </div>
    </div>

    <!-- Contact Start -->
    <div class="container-fluid contact py-5">
        <div class="container py-5">
            <div class="p-5 bg-light rounded">
                <div class="row g-4">
                    <div class="col-12">
                        <div class="text-center mx-auto" style="max-width: 700px;">
                            <h1 class="text-primary">Bizimlə əlaqə saxlayın</h1>
                            <p class="mb-4">Suallarınız və təklifləriniz üçün bizimlə əlaqə saxlayın.</p>                        </div>
                    </div>
                    <div class="col-lg-12">
                        <div class="h-100 rounded">
                            <iframe class="rounded w-100"
                                    style="height: 400px;"
                                    src="https://maps.google.com/maps?q=Bakı,Azərbaycan&output=embed"
                                    loading="lazy"
                                    referrerpolicy="no-referrer-when-downgrade"></iframe>
                        </div>
                    </div>
                    <div class="col-lg-7">
                        <div th:if="${success != null}"
                             th:class="${success} ? 'alert alert-success' : 'alert alert-danger'"
                             th:text="${success} ? 'Mesajınız göndərildi!' : 'Xəta baş verdi, yenidən cəhd edin.'">
                        </div>
                        <form th:action="@{/contact}" method="post">
                            <input type="text" name="name" class="w-100 form-control border-0 py-3 mb-4" placeholder="Adınız" required>
                            <input type="email" name="email" class="w-100 form-control border-0 py-3 mb-4" placeholder="Email ünvanınız" required>
                            <textarea name="message" class="w-100 form-control border-0 mb-4" rows="5" cols="10" placeholder="Mesajınız" required></textarea>
                            <button class="w-100 btn form-control border-secondary py-3 bg-white text-primary" type="submit">Göndər</button>
                        </form>
                    </div>
                    <div class="col-lg-5">
                        <div class="d-flex p-4 rounded mb-4 bg-white">
                            <i class="fas fa-map-marker-alt fa-2x text-primary me-4"></i>
                            <div>
                                <h4>Ünvan</h4>
                                <p class="mb-2">Bakı şəhəri, Azərbaycan</p>
                            </div>
                        </div>
                        <div class="d-flex p-4 rounded mb-4 bg-white">
                            <i class="fas fa-envelope fa-2x text-primary me-4"></i>
                            <div>
                                <h4>Bizə yazın</h4>
                                <p class="mb-2">info@example.com</p>
                            </div>
                        </div>
                        <div class="d-flex p-4 rounded bg-white">
                            <i class="fa fa-phone-alt fa-2x text-primary me-4"></i>
                            <div>
                                <h4>Telefon</h4>
                                <p class="mb-2">(+994) 12 345 67 89</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Contact End -->
</main>

</body>
</html>
