<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout}" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">Title</title>
</head>
<body>


<main layout:fragment="content">

    <div class="container-fluid bg-light py-3 mb-2">
        <div class="container">
            <nav>
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item">
                        <a th:href="@{/}" class="text-decoration-none text-muted">
                            <i class="fa fa-home me-1"></i>Əsas səhifə
                        </a>
                    </li>
                    <li class="breadcrumb-item active text-primary fw-bold" aria-current="page">Sifarişi Rəsmiləşdir</li>
                </ol>
            </nav>
        </div>
    </div>

    <!-- Checkout Page Start -->
    <div class="container-fluid py-5">
        <div class="container py-5">
            <h1 class="mb-4">Ödəniş məlumatları</h1>
            <form action="/checkout" method="post">
                <div class="row g-5">
                    <div class="col-md-12 col-lg-6 col-xl-7">
                        <div class="row">

                        </div>

                        <div class="form-item">
                            <label class="form-label my-3">Ünvan <sup>*</sup></label>
                            <input type="text" name="address" class="form-control" placeholder="Ev Ünvanı, Küçə">
                        </div>

                        <div class="form-item">
                            <label class="form-label my-3">Telefon<sup>*</sup></label>
                            <input type="tel" name="phone" class="form-control">
                        </div>


                    </div>
                    <div class="col-md-12 col-lg-6 col-xl-5">
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                <tr>
                                    <th scope="col">Məhsullar</th>
                                    <th scope="col">Ad</th>
                                    <th scope="col">Qiymət</th>
                                    <th scope="col" class="ps-4">Miqdar</th>
                                    <th scope="col">Cəm</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="basket : ${baskets}">
                                    <th scope="row">
                                        <div class="d-flex align-items-center mt-2">
                                            <img th:src="@{${basket.product.photoUrl}}" class="img-fluid rounded-circle" style="width: 90px; height: 90px;" alt="">
                                        </div>
                                    </th>
                                    <td th:text="${basket.product.name}" class="py-5">Awesome Brocoli</td>
                                    <td class="py-5">
                                        <span class="text-nowrap" th:text="${basket.product.price} + ' ₼'">0.00 ₼</span>
                                    </td>
                                    <td class="py-5 ps-5" th:text="${basket.quantity}">2</td>
                                    <td class="py-5">
                                        <span class="text-nowrap" th:text="${basket.totalPrice} + ' ₼'">0.00 ₼</span>
                                    </td>
                                </tr>

                                <tr>
                                    <th scope="row">
                                    </th>
                                    <td class="py-5"></td>
                                    <td class="py-5"></td>
                                    <td class="py-5">
                                        <p class="mb-0 text-dark py-3">Aralıq cəm</p>
                                    </td>
                                    <td class="py-5">
                                        <div class="py-3 border-bottom border-top">
                                            <p class="mb-0 text-dark text-nowrap" th:text="${subtotal} + ' ₼'">32.70 ₼</p>
                                        </div>
                                    </td>
                                </tr>

                                <tr>
                                    <th scope="row">
                                    </th>
                                    <td class="py-5">
                                        <p class="mb-0 text-dark text-uppercase py-3">Yekun cəm</p>
                                    </td>
                                    <td class="py-5"></td>
                                    <td class="py-5"></td>
                                    <td class="py-5">
                                        <div class="py-3 border-bottom border-top">
                                            <p class="mb-0 text-dark" th:text="${total} + ' ₼'">$135.00</p>
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="row g-4 text-center align-items-center justify-content-center pt-4">
                            <button type="submit" class="btn border-secondary py-3 px-4 text-uppercase w-100 text-primary">Səbəti Təsdiqlə</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <!-- Checkout Page End -->
</main>

</body>
</html>
