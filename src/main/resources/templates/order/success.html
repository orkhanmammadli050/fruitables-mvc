<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout}" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">Sifariş uğurlu</title>
</head>
<body>

<main layout:fragment="content">

    <div class="container-fluid py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="bg-light border border-primary rounded p-5 text-center shadow-sm">
                        <i class="fa fa-check-circle text-primary mb-3" style="font-size: 60px;"></i>
                        <h2 class="mb-3">Sifarişiniz qəbul edildi</h2>
                        <p class="text-muted mb-4">Sifarişiniz uğurla qeydə alındı, tezliklə sizinlə əlaqə saxlanılacaq.</p>
                        <a href="/shop" class="btn btn-primary rounded-pill px-4 py-2">Alış-verişə davam et</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</main>

</html>
